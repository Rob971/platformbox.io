<svg width="4200" height="700" viewBox="0 0 4200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stopColor="rgba(59,130,246,0.14)"/>
      <stop offset="100%" stopColor="rgba(59,130,246,0)"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="4200" height="700" fill="#09090b"/>
  <rect width="4200" height="700" fill="url(#grid)"/>
  <rect width="4200" height="700" fill="url(#glow)"/>

  <!-- Small logo mark + wordmark, top-left (avatar-safe zone) -->
  <g>
    <rect x="120" y="80" width="76" height="76" rx="17" fill="#09090b"/>
    <path d="M 151.5 100 H 140 V 136 H 151.5" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 164.5 100 H 176 V 136 H 164.5" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="216" y="131" fill="#fafafa" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="600">PlatformBox<tspan fill="#60a5fa">.io</tspan></text>
  </g>

  <!-- Headline -->
  <text x="2100" y="330" text-anchor="middle" fill="#fafafa" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="150" font-weight="700" letter-spacing="-2">A SHORTER PATH TO PRODUCTION</text>
  <text x="2100" y="495" text-anchor="middle" fill="#fafafa" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="150" font-weight="700" letter-spacing="-2">LIVE IN <tspan fill="#60a5fa">14 WORKING DAYS.</tspan></text>

  <!-- Supporting line (differentiation, not technology) -->
  <text x="2100" y="600" text-anchor="middle" fill="#a1a1aa" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="500">Standardized golden paths · Fixed‑price · No lock‑in</text>
</svg>
