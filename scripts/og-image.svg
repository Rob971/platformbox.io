<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stopColor="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stopColor="rgba(59,130,246,0)"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(60,60)">
    <rect width="88" height="88" rx="20" fill="#09090b"/>
    <path d="M 34 24 H 24 V 64 H 34" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 54 24 H 64 V 64 H 54" fill="none" stroke="url(#brand)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="44" fill="#fafafa" font-family="Geist, -apple-system, sans-serif" font-size="30" font-weight="600">PlatformBox<span fill="#60a5fa">.io</span></text>
  </g>

  <!-- Headline -->
  <text x="60" y="330" fill="#fafafa" font-family="Geist, -apple-system, sans-serif" font-size="64" font-weight="600" letter-spacing="-1">Your developer platform.</text>
  <text x="60" y="398" fill="#fafafa" font-family="Geist, -apple-system, sans-serif" font-size="64" font-weight="600" letter-spacing="-1">Live in <tspan fill="#60a5fa">14 days.</tspan></text>

  <!-- Pricing row -->
  <text x="60" y="478" fill="#a1a1aa" font-family="Geist, -apple-system, sans-serif" font-size="30" font-weight="500">Launch €20,000 · Scale €39,000 · Enterprise €60,000+</text>

  <!-- Bottom divider -->
  <line x1="60" y1="574" x2="1140" y2="574" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
</svg>