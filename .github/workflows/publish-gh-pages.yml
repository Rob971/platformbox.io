name: Publish gh-pages branch

# Fallback publisher for classic "Deploy from a branch" Pages source.
# Keeps the gh-pages branch in sync when Actions Pages isn't enabled yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          cname: www.platformbox.io
          commit_message: "Deploy static site to GitHub Pages"
