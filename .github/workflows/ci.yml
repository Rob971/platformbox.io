name: CI Verification & Drift Check
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, Lint & Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22: tests/assessment-proxy.test.mjs loads src/proxy.ts with Node's native TypeScript support.
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check:claims
      - run: npm run check
      - run: npm test
