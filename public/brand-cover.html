<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlatformBox Cover</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1128px; height: 191px; overflow: hidden; background: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.container {
  width: 1128px; height: 191px;
  display: flex; align-items: center; justify-content: center;
  gap: 24px; color: #ffffff;
}
svg { display: block; flex-shrink: 0; }
.text h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.text h1 span { color: #60a5fa; }
.text p { font-size: 12px; color: #a1a1aa; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="container">
<svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#60a5fa"/>
    </linearGradient>
  </defs>
  <path d="M 208,128 H 128 V 384 H 208" fill="none" stroke="url(#g)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 304,128 H 384 V 384 H 304" fill="none" stroke="url(#g)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="text">
  <h1>PlatformBox<span>.io</span></h1>
  <p>The 14-Day Enterprise Internal Developer Platform</p>
</div>
</div>
</body>
</html>
