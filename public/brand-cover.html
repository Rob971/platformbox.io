<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlatformBox LinkedIn Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1128px; height: 188px; overflow: hidden;
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .bg {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse 60% 120% at 50% -20%, rgba(59,130,246,0.14), transparent),
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 48px 48px, 48px 48px;
  }
  .logo {
    position: absolute; top: 20px; left: 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .logo .mark { display: block; }
  .logo .name { font-size: 13px; font-weight: 600; color: #fafafa; }
  .logo .name span { color: #60a5fa; }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #fafafa;
  }
  .center h1 {
    font-size: 38px; font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.12;
  }
  .center h1 .accent { color: #60a5fa; }
  .center p { margin-top: 10px; font-size: 14px; color: #a1a1aa; }
  .center .stack {
    margin-top: 8px; font-size: 11px;
    letter-spacing: 0.18em; color: #71717a;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="logo">
    <svg class="mark" width="30" height="30" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="112" fill="#09090b"/>
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#3b82f6"/>
          <stop offset="100%" stopColor="#60a5fa"/>
        </linearGradient>
      </defs>
      <path d="M 208,128 H 128 V 384 H 208" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 304,128 H 384 V 384 H 304" fill="none" stroke="url(#g)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">PlatformBox<span>.io</span></span>
  </div>
  <div class="center">
    <h1>A SHORTER PATH TO PRODUCTION<br>LIVE IN <span class="accent">14 DAYS.</span></h1>
    <p>Standardized golden paths · Fixed‑price · No lock‑in</p>
  </div>
</body>
</html>
